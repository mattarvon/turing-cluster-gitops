# NVIDIA GPU scheduling on the x86 node "zullx" (RTX 2070 SUPER).
# Uses the official NVIDIA k8s-device-plugin (zullx is a normal x86+NVIDIA box,
# unlike the Jetson which needs the squat generic-device-plugin). Runs under the
# nvidia RuntimeClass so it can reach the GPU via NVML.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-x86
  namespace: kube-system
  labels:
    app: nvidia-device-plugin-x86
spec:
  selector:
    matchLabels:
      app: nvidia-device-plugin-x86
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: nvidia-device-plugin-x86
    spec:
      runtimeClassName: nvidia
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/hostname: zullx
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.17.4
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
