# Points the selector-less ai/ollama Service at the RTX 5090 workstation on the LAN.
# GPU-as-a-service: the rig is NOT a cluster node; the cluster just consumes its API.
apiVersion: v1
kind: Endpoints
metadata:
  name: ollama
  namespace: ai
subsets:
  - addresses:
      - ip: 192.168.1.110
    ports:
      - name: http
        port: 11434
        protocol: TCP
