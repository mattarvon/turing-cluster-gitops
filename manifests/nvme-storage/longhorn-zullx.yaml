# Longhorn class for stateful services that should live on zullx.
# `dataLocality: best-effort` keeps one replica on the node running the pod (zullx, NVMe),
# so reads/writes stay local and the volume keeps serving when the NUC (the only other
# Longhorn node) is down. The second replica lands on the NUC's SATA disk for redundancy.
# Retain: deleting the PVC never deletes the data.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-zullx
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  dataLocality: "best-effort"
  staleReplicaTimeout: "30"
  fsType: "ext4"
  disableRevisionCounter: "true"
  dataEngine: "v1"
