# Scrapes the RTX 5090 on the Windows workstation, which is NOT a cluster node.
#
# The exporter is nvidia_gpu_exporter (a wrapper around nvidia-smi) running on
# the workstation at :9835, started from the user's Startup folder.
#
# WHY ScrapeConfig AND NOT THE ollama-endpoint PATTERN:
# The obvious approach is a selector-less Service plus a hand-written Endpoints
# object, the way manifests/ollama-endpoint projects the inference API into the
# cluster. That does not work under GitOps here. Argo CD excludes Endpoints and
# EndpointSlice from management cluster-wide (argocd-cm resource.exclusions), so
# the Endpoints object is silently never created and the Service has nothing
# behind it. The app still reports Synced, which makes it worse.
#
# A ScrapeConfig points Prometheus straight at a static target with no Service
# or Endpoints involved, so the whole thing is genuinely declarative.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: gpu-workstation
  namespace: monitoring
  labels:
    # Must match the Prometheus CR's scrapeConfigSelector.
    release: monitoring
spec:
  staticConfigs:
    - targets:
        - 192.168.1.110:9835
      labels:
        host: gpu-workstation
        gpu: rtx-5090
  scrapeInterval: 30s
  scrapeTimeout: 10s
  metricsPath: /metrics
  # The workstation is a desktop: it sleeps, reboots, and gets used for other
  # things. A down target here means local inference is unavailable, not that
  # anything is broken. Do not treat it as an alerting signal.
