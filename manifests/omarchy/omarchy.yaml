# Omarchy (Arch + Hyprland) VM, installed unattended from the official ISO.
#
# Boot: UEFI, disk first, installer ISO second. First boot the empty disk
# falls through to the ISO; the installer finds the `cidata` disk (KubeVirt
# builds it from Secret vms/omarchy-cidata, label set below), installs with
# nobody at the keyboard, reboots into the disk. ~5 min.
#
# Reset (reinstall from scratch):  kubectl delete vm omarchy -n vms
# SSH:  ssh matt@<node> -p 32223     keys from the Secret's authorized_keys
# Desktop: VNC to <node>:32391 (wayvnc in the guest; software-rendered, no 3D)
#
# Secret vms/omarchy-cidata is out-of-band (password hash + ssh key). Keys:
# user_configuration.json user_credentials.json user_full_name.txt
# user_email_address.txt user_encrypt_installation.txt authorized_keys
# Format: omarchy.org/manual/unattended-installs
#
# TRAP: user_configuration.json carries absolute partition sizes. A "40Gi"
# blank DataVolume on longhorn-scratch is NOT 40 GiB inside the guest; CDI
# keeps filesystem headroom and the disk.img is 41958768640 bytes (39.08 GiB).
# Sizing partitions for 40 GiB fails with "Partition overlaps backup GPT
# header" and the installer drops to a shell. Sizes in the Secret assume
# exactly that byte count: ESP 2 GiB at 1 MiB, root = rest minus 1 MiB.
apiVersion: cdi.kubevirt.io/v1beta1
kind: DataVolume
metadata:
  name: omarchy-iso
  namespace: vms
  annotations:
    # Standalone, not a dataVolumeTemplate: survives VM resets, imported once.
    cdi.kubevirt.io/storage.deleteAfterCompletion: "false"
spec:
  source:
    http:
      url: https://iso.omarchy.org/omarchy-4.0.2.iso
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 8Gi
    storageClassName: longhorn-scratch
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: omarchy
  namespace: vms
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: omarchy-disk
      spec:
        source:
          blank: {}
        storage:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 40Gi
          storageClassName: longhorn-scratch
  template:
    metadata:
      labels:
        kubevirt.io/vm: omarchy
    spec:
      architecture: amd64
      nodeSelector:
        kubernetes.io/hostname: zullx
      domain:
        machine:
          type: q35
        firmware:
          bootloader:
            efi:
              secureBoot: false
        cpu:
          cores: 4
        memory:
          guest: 8Gi
        devices:
          rng: {}
          disks:
            - name: rootdisk
              bootOrder: 1
              disk:
                bus: virtio
            - name: installer
              bootOrder: 2
              cdrom:
                bus: sata
            - name: cidata
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                - name: vnc
                  port: 5900
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: omarchy-disk
        - name: installer
          dataVolume:
            name: omarchy-iso
        - name: cidata
          secret:
            secretName: omarchy-cidata
            volumeLabel: cidata
---
apiVersion: v1
kind: Service
metadata:
  name: omarchy-ssh
  namespace: vms
spec:
  type: NodePort
  selector:
    kubevirt.io/vm: omarchy
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 32223
---
# wayvnc inside the guest (autostarted by Hyprland, SDDM auto-logs matt in so a
# session exists at boot). No VNC auth: LAN only, and Omarchy's lock screen is
# the real gate. Connect any VNC client to <node>:32391.
apiVersion: v1
kind: Service
metadata:
  name: omarchy-vnc
  namespace: vms
spec:
  type: NodePort
  selector:
    kubevirt.io/vm: omarchy
  ports:
    - name: vnc
      port: 5900
      targetPort: 5900
      nodePort: 32391
---
# Browser access: noVNC in front of the guest's wayvnc. No client needed.
#   http://<node>:32392/vnc.html?autoconnect=1&resize=scale
# websockify bridges the browser's WebSocket to omarchy-vnc:5900 in-cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: omarchy-novnc
  namespace: vms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: omarchy-novnc
  template:
    metadata:
      labels:
        app: omarchy-novnc
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: novnc
          # Plain websockify + the noVNC web UI. No desktop of its own; it only
          # bridges browser WebSocket <-> the guest's wayvnc.
          image: python:3.12-alpine
          command:
            - sh
            - -ec
            - |
              pip install -q websockify==0.13.0
              wget -qO- https://github.com/novnc/noVNC/archive/refs/tags/v1.7.0.tar.gz | tar xz -C /tmp
              mv /tmp/noVNC-1.7.0 /novnc
              exec websockify --web /novnc 8080 omarchy-vnc.vms.svc.cluster.local:5900
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /vnc.html, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: omarchy-novnc
  namespace: vms
spec:
  type: NodePort
  selector:
    app: omarchy-novnc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 32392
