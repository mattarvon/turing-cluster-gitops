# Disposable Kali box. Cloned from kali-golden-disk on creation.
#
# Reset:  kubectl delete vm kalx -n vms   (Argo recreates it, ~2 min)
# SSH:    ssh matt@<any node> -p 32222       keys only
# RDP:    <any node>:32390                   user matt, password from Secret
#
# Password lives in Secret vms/kalx-rdp (key `password`), not here. It is
# attached as a virtio disk and applied by cloud-init at boot. No Secret, no
# boot. Change it:
#   kubectl create secret generic kalx-rdp -n vms --from-literal=password=... \
#     --dry-run=client -o yaml | kubectl apply -f -
#   kubectl delete vm kalx -n vms
#
# Don't `virtctl stop` it; selfHeal restarts it. Delete it or leave it.
#
# Masquerade networking: LAN targets see the node IP (.105 or .216), not the
# VM. Inbound needs a port under interfaces[].ports plus a Service.
#
# No sync-waves on either VM. CDI does the ordering: it won't clone a PVC
# another pod has mounted (CloneSourceInUse) and waits for the golden to
# power off. Argo health for the stopped golden is handled by
# bootstrap/out-of-band/patch-argocd-vm-health.yaml.
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: kalx
  namespace: vms
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: kalx-disk
      spec:
        source:
          pvc:
            name: kali-golden-disk
            namespace: vms
        storage:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 40Gi
          storageClassName: longhorn-scratch
  template:
    metadata:
      labels:
        kubevirt.io/vm: kalx
    spec:
      architecture: amd64
      nodeSelector:
        kubernetes.io/arch: amd64
      domain:
        machine:
          type: q35
        cpu:
          cores: 4
        memory:
          guest: 8Gi
        devices:
          rng: {}
          disks:
            - name: rootdisk
              disk:
                bus: virtio
            - name: cloudinit
              disk:
                bus: virtio
            - name: creds
              serial: creds      # /dev/disk/by-id/virtio-creds in the guest
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: ssh
                  port: 22
                - name: rdp
                  port: 3389
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: kalx-disk
        - name: creds
          secret:
            secretName: kalx-rdp
        - name: cloudinit
          cloudInitNoCloud:
            userData: |
              #cloud-config
              hostname: kalx
              ssh_pwauth: false
              growpart:
                mode: auto
                devices: ["/"]
              resize_rootfs: true
              users:
                - name: matt
                  groups: [sudo, users]
                  shell: /bin/bash
                  sudo: "ALL=(ALL) NOPASSWD:ALL"
                  lock_passwd: false
                  ssh_authorized_keys:
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFRhyVaK4soxxC7Q8VmrGJG7TtRrhvL8pTPKNKRvkseF matt-gb10
                    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKGSfDU36vyCQQXQQYrfpQ+nFb9jf6wibUuSzwhq5ajY claude-turing-cluster
              runcmd:
                - [bash, -c, "mkdir -p /mnt/creds && mount -o ro /dev/disk/by-id/virtio-creds /mnt/creds && echo \"matt:$(cat /mnt/creds/password)\" | chpasswd && umount /mnt/creds"]
                - [bash, -c, "echo xfce4-session > /home/matt/.xsession && chown matt:matt /home/matt/.xsession"]
                - [systemctl, restart, xrdp]
---
apiVersion: v1
kind: Service
metadata:
  name: kalx-rdp
  namespace: vms
spec:
  type: NodePort
  selector:
    kubevirt.io/vm: kalx
  ports:
    - name: rdp
      port: 3389
      targetPort: 3389
      nodePort: 32390    # 32389 is desktop-vm
---
apiVersion: v1
kind: Service
metadata:
  name: kalx-ssh
  namespace: vms
spec:
  type: NodePort
  selector:
    kubevirt.io/vm: kalx
  ports:
    - name: ssh
      port: 22
      targetPort: 22
      nodePort: 32222
