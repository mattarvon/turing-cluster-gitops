# LiteLLM proxy — one OpenAI-compatible endpoint that routes to local Ollama (RTX 5090)
# and Anthropic (Claude). Models appear in Open WebUI's dropdown → pick per chat.
# Secrets (ANTHROPIC_API_KEY, LITELLM_MASTER_KEY) live in the `litellm-secrets` Secret,
# created out-of-band (NOT in this public repo).
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      # ---- local (Ollama on the RTX 5090) ----
      - model_name: qwen3.6-a3b
        litellm_params:
          model: ollama_chat/qwen3.6-a3b
          api_base: http://ollama.ai.svc.cluster.local:11434
          # Qwen3.6 is a thinking model; without this its chain-of-thought leaks
          # into the response body (no opening <think> tag) and reads as gibberish.
          think: false
      - model_name: llama3.1-local
        litellm_params:
          model: ollama/llama3.1:8b
          api_base: http://ollama.ai.svc.cluster.local:11434
      - model_name: gpt-oss-local
        litellm_params:
          model: ollama/gpt-oss:20b
          api_base: http://ollama.ai.svc.cluster.local:11434
      # ---- Anthropic (Claude) ----
      - model_name: claude-opus
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-sonnet
        litellm_params:
          model: anthropic/claude-sonnet-5
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-haiku
        litellm_params:
          model: anthropic/claude-haiku-4-5-20251001
          api_key: os.environ/ANTHROPIC_API_KEY
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    litellm_settings:
      drop_params: true
      num_retries: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        checksum/config: "v3-qwen-nothink"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
          readinessProbe:
            httpGet: {path: /health/liveliness, port: 4000}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 150m, memory: 512Mi}
            limits: {memory: 3Gi}
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai
spec:
  type: NodePort
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 32500
