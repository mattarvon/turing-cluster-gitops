# LiteLLM proxy — one OpenAI-compatible endpoint that routes to local Ollama (RTX 5090)
# and Anthropic (Claude). Models appear in Open WebUI's dropdown → pick per chat.
# Secrets (ANTHROPIC_API_KEY, LITELLM_MASTER_KEY) live in the `litellm-secrets` Secret,
# created out-of-band (NOT in this public repo).
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      # ---- local (Ollama on the RTX 5090) ----
      # Aliases are ROLES, not model names. Swap the model underneath and nothing
      # downstream changes. Always use library tags (name:tag) so `ollama pull`
      # can refresh them; a custom tag never updates.
      #
      # local-fast   small, two parallel slots fit in VRAM, use for agents/concurrency
      # local-chat   default; MoE, ~230 tok/s, one user at a time (22 GB, see benchmarks)
      # local-smart  strongest local model; dense, slower, one user at a time
      - model_name: local-fast
        litellm_params:
          model: ollama_chat/gemma4:12b
          api_base: http://ollama.ai.svc.cluster.local:11434
          think: false
      - model_name: local-chat
        litellm_params:
          model: ollama_chat/qwen3.6:35b-a3b
          api_base: http://ollama.ai.svc.cluster.local:11434
          # Qwen3.x are thinking models; without this the chain-of-thought leaks
          # into the response body (no opening <think> tag) and reads as gibberish.
          think: false
      - model_name: local-smart
        litellm_params:
          model: ollama_chat/qwen3.8:27b
          api_base: http://ollama.ai.svc.cluster.local:11434
          think: false
      # ---- auto-routed local (the default in Open WebUI) ----
      # Heuristic classifier grades each prompt (length, code, reasoning cues)
      # into a tier, no extra API call. Three tiers stay local; REASONING and
      # the last-resort fallback go to Claude Sonnet (paid). Which model won
      # is in the x-litellm-model-name response header.
      - model_name: local
        litellm_params:
          model: auto_router/complexity_router
          drop_params: true
          complexity_router_config:
            tiers:
              SIMPLE: local-fast
              MEDIUM: local-chat
              COMPLEX: local-smart
              REASONING: claude-sonnet   # the only tier that leaves the house
            classifier_type: heuristic
            # The heuristic under-grades code; a full pytest request scored
            # MEDIUM. Keyword rules are checked first and are deterministic.
            keyword_tier_rules:
              - keywords: ["hi", "hello", "thanks", "thank you"]
                tier: SIMPLE
              - keywords: ["python", "function", "regex", "script", "kubernetes", "k8s",
                           "yaml", "sql", "bash", "powershell", "terraform", "dockerfile",
                           "debug", "stack trace", "traceback", "refactor", "unit test"]
                tier: COMPLEX
              - keywords: ["compare", "argue", "analyze", "analyse", "in detail", "pros and cons",
                           "trade-off", "tradeoff", "summarize", "summarise", "rewrite", "draft"]
                tier: MEDIUM
              # Explicit escalation to Claude. Say one of these and it goes out.
              - keywords: ["think hard", "think carefully", "carefully", "prove", "step by step",
                           "rigorous", "use claude", "ask claude"]
                tier: REASONING
            session_affinity: false
            adaptive: false
          complexity_router_default_model: local-chat
      # ---- Anthropic (Claude) ----
      - model_name: claude-opus
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-sonnet
        litellm_params:
          model: anthropic/claude-sonnet-5
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-haiku
        litellm_params:
          model: anthropic/claude-haiku-4-5-20251001
          api_key: os.environ/ANTHROPIC_API_KEY
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    litellm_settings:
      drop_params: true
      num_retries: 2
      callbacks: model_label.proxy_handler_instance
      # The big models serve one user at a time (see benchmarks/results). If
      # local-chat or local-smart errors out or is still queued after
      # request_timeout, hand the request to gemma4 instead of making the
      # second user wait. Cooldown keeps us from hammering a busy backend.
      request_timeout: 90
      allowed_fails: 3
      cooldown_time: 30
      fallbacks:
        - local-chat: [local-fast]
        - local-smart: [local-chat, local-fast]
        # Last resort: workstation off (reboot, gaming), every local model is
        # unreachable. Go to Anthropic rather than fail.
        - local-fast: [claude-sonnet]
    router_settings:
      enable_pre_call_checks: true
  # Proxy hook. Loaded via litellm_settings.callbacks; the proxy imports it
  # from the config.yaml directory. Only labels requests to `local` and
  # `local-*`, where the answering model is not what the user picked.
  # Explicit claude-*/API clients are left untouched.
  model_label.py: |
    from typing import Any, AsyncGenerator
    from litellm.integrations.custom_logger import CustomLogger
    from litellm.types.utils import ModelResponseStream, StreamingChoices, Delta

    def _label(model: str) -> str:
        m = (model or "").replace("ollama_chat/", "").replace("ollama/", "").replace("anthropic/", "")
        return f"\n\n*— {m}*"

    def _wants_label(data: dict) -> bool:
        return str(data.get("model", "")).startswith("local")

    class ModelLabel(CustomLogger):
        async def async_post_call_success_hook(self, data, user_api_key_dict, response):
            try:
                if not _wants_label(data):
                    return response
                choices = getattr(response, "choices", None)
                if not choices:
                    return response
                msg = getattr(choices[0], "message", None)
                if msg is not None and isinstance(getattr(msg, "content", None), str):
                    msg.content = msg.content + _label(getattr(response, "model", ""))
            except Exception:
                pass
            return response

        async def async_post_call_streaming_iterator_hook(
            self, user_api_key_dict, response: Any, request_data: dict
        ) -> AsyncGenerator[ModelResponseStream, None]:
            if not _wants_label(request_data):
                async for item in response:
                    yield item
                return
            model, last_id, injected = "", "", False
            async for item in response:
                try:
                    model = getattr(item, "model", None) or model
                    last_id = getattr(item, "id", None) or last_id
                    ch = getattr(item, "choices", None)
                    if not injected and ch and getattr(ch[0], "finish_reason", None):
                        yield ModelResponseStream(
                            id=last_id, model=model,
                            choices=[StreamingChoices(index=0, delta=Delta(content=_label(model)), finish_reason=None)],
                        )
                        injected = True
                except Exception:
                    pass
                yield item
            if not injected and model:
                yield ModelResponseStream(
                    id=last_id, model=model,
                    choices=[StreamingChoices(index=0, delta=Delta(content=_label(model)), finish_reason=None)],
                )

    proxy_handler_instance = ModelLabel()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        checksum/config: "v5-model-label-md"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-stable
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
          readinessProbe:
            httpGet: {path: /health/liveliness, port: 4000}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 150m, memory: 512Mi}
            limits: {memory: 3Gi}
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai
spec:
  type: NodePort
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 32500
