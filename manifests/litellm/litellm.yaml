# LiteLLM proxy — one OpenAI-compatible endpoint that routes to local Ollama (RTX 5090)
# and Anthropic (Claude). Models appear in Open WebUI's dropdown → pick per chat.
# Secrets (ANTHROPIC_API_KEY, LITELLM_MASTER_KEY) live in the `litellm-secrets` Secret,
# created out-of-band (NOT in this public repo).
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:
      # ---- local (Ollama on the RTX 5090) ----
      # Aliases are ROLES, not model names. Swap the model underneath and nothing
      # downstream changes. Always use library tags (name:tag) so `ollama pull`
      # can refresh them; a custom tag never updates.
      #
      # local-fast   small, two parallel slots fit in VRAM, use for agents/concurrency
      # local-chat   default; MoE, ~230 tok/s, one user at a time (22 GB, see benchmarks)
      # local-smart  strongest local model; dense, slower, one user at a time
      # local-agent  tool calling, screenshots/charts/documents; ~58 tok/s, 18.5 GB.
      #              Not a complexity tier: model_label.py sends `local` requests
      #              that carry tools or images here (see the pre-call hook).
      - model_name: local-fast
        litellm_params:
          model: ollama_chat/gemma4:12b
          api_base: http://ollama.ai.svc.cluster.local:11434
          think: false
      - model_name: local-chat
        litellm_params:
          model: ollama_chat/qwen3.6:35b-a3b
          api_base: http://ollama.ai.svc.cluster.local:11434
          # Qwen3.x are thinking models; without this the chain-of-thought leaks
          # into the response body (no opening <think> tag) and reads as gibberish.
          think: false
      - model_name: local-smart
        litellm_params:
          model: ollama_chat/qwen3.8:27b
          api_base: http://ollama.ai.svc.cluster.local:11434
          think: false
      - model_name: local-agent
        litellm_params:
          model: ollama_chat/muse-glimmer:30b
          api_base: http://ollama.ai.svc.cluster.local:11434
          # Muse still spends 45-185 hidden tokens before answering with
          # thinking off; it does not leak into the response body.
          think: false
      # ---- auto-routed local (the default in Open WebUI) ----
      # Step 1, model_label.py pre-call hook: a `local` request that carries
      # tool definitions or images, or says "use muse", goes to local-agent.
      # Step 2, everything else: heuristic classifier grades each prompt
      # (length, code, reasoning cues) into a tier, no extra API call. Three
      # tiers stay local; REASONING and the last-resort fallback go to Claude
      # Sonnet (paid). Which model won is in the x-litellm-model-name header.
      - model_name: local
        litellm_params:
          model: auto_router/complexity_router
          drop_params: true
          complexity_router_config:
            tiers:
              SIMPLE: local-fast
              MEDIUM: local-chat
              COMPLEX: local-smart
              REASONING: claude-sonnet   # the only tier that leaves the house
            classifier_type: heuristic
            # The heuristic under-grades code; a full pytest request scored
            # MEDIUM. Keyword rules are checked first and are deterministic.
            keyword_tier_rules:
              - keywords: ["hi", "hello", "thanks", "thank you"]
                tier: SIMPLE
              - keywords: ["python", "function", "regex", "script", "kubernetes", "k8s",
                           "yaml", "sql", "bash", "powershell", "terraform", "dockerfile",
                           "debug", "stack trace", "traceback", "refactor", "unit test"]
                tier: COMPLEX
              - keywords: ["compare", "argue", "analyze", "analyse", "in detail", "pros and cons",
                           "trade-off", "tradeoff", "summarize", "summarise", "rewrite", "draft"]
                tier: MEDIUM
              # Explicit escalation to Claude. Say one of these and it goes out.
              - keywords: ["think hard", "think carefully", "carefully", "prove", "step by step",
                           "rigorous", "use claude", "ask claude"]
                tier: REASONING
            session_affinity: false
            adaptive: false
          complexity_router_default_model: local-chat
      # ---- Anthropic (Claude) ----
      - model_name: claude-opus
        litellm_params:
          model: anthropic/claude-opus-4-8
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-sonnet
        litellm_params:
          model: anthropic/claude-sonnet-5
          api_key: os.environ/ANTHROPIC_API_KEY
      - model_name: claude-haiku
        litellm_params:
          model: anthropic/claude-haiku-4-5-20251001
          api_key: os.environ/ANTHROPIC_API_KEY
    general_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
    litellm_settings:
      drop_params: true
      num_retries: 2
      callbacks: model_label.proxy_handler_instance
      # The big models serve one user at a time (see benchmarks/results). If
      # local-chat or local-smart errors out or is still queued after
      # request_timeout, hand the request to gemma4 instead of making the
      # second user wait. Cooldown keeps us from hammering a busy backend.
      request_timeout: 90
      allowed_fails: 3
      cooldown_time: 30
      fallbacks:
        - local-chat: [local-fast]
        - local-smart: [local-chat, local-fast]
        - local-agent: [local-chat, local-fast]
        # Last resort: workstation off (reboot, gaming), every local model is
        # unreachable. Go to Anthropic rather than fail.
        - local-fast: [claude-sonnet]
    router_settings:
      enable_pre_call_checks: true
  # Proxy hook. Loaded via litellm_settings.callbacks; the proxy imports it
  # from the config.yaml directory. Two jobs:
  # 1. Pre-call: reroute `local` requests that need an agent model (tool
  #    definitions, image input, or "use muse") to local-agent, before the
  #    complexity router sees them. The router's four tiers are fixed.
  # 2. Post-call: label replies to `local` and `local-*` with the model that
  #    answered. Explicit claude-*/API clients are left untouched.
  model_label.py: |
    from typing import Any, AsyncGenerator
    from litellm.integrations.custom_logger import CustomLogger
    from litellm.types.utils import ModelResponseStream, StreamingChoices, Delta

    def _label(model: str) -> str:
        m = (model or "").replace("ollama_chat/", "").replace("ollama/", "").replace("anthropic/", "")
        return f"\n\n*— {m}*"

    def _wants_label(data: dict) -> bool:
        return str(data.get("model", "")).startswith("local")

    AGENT_KEYWORDS = ("use muse", "ask muse")

    def _has_image(messages) -> bool:
        for msg in messages or []:
            content = msg.get("content") if isinstance(msg, dict) else None
            if isinstance(content, list):
                for part in content:
                    if isinstance(part, dict) and part.get("type") in ("image_url", "image", "input_image"):
                        return True
            if isinstance(msg, dict) and msg.get("images"):
                return True
        return False

    def _last_user_text(messages) -> str:
        for msg in reversed(messages or []):
            if isinstance(msg, dict) and msg.get("role") == "user":
                content = msg.get("content")
                if isinstance(content, str):
                    return content.lower()
                if isinstance(content, list):
                    return " ".join(p.get("text", "") for p in content if isinstance(p, dict)).lower()
        return ""

    def _agent_reason(data: dict) -> str:
        if data.get("tools") or data.get("functions"):
            return "tools"
        messages = data.get("messages")
        if _has_image(messages):
            return "image"
        text = _last_user_text(messages)
        if any(k in text for k in AGENT_KEYWORDS):
            return "keyword"
        return ""

    class ModelLabel(CustomLogger):
        async def async_pre_call_hook(self, user_api_key_dict, cache, data, call_type):
            try:
                if data.get("model") == "local":
                    reason = _agent_reason(data)
                    if reason:
                        data["model"] = "local-agent"
                        meta = data.setdefault("metadata", {})
                        if isinstance(meta, dict):
                            meta["local_agent_reason"] = reason
            except Exception:
                pass
            return data

        async def async_post_call_success_hook(self, data, user_api_key_dict, response):
            try:
                if not _wants_label(data):
                    return response
                choices = getattr(response, "choices", None)
                if not choices:
                    return response
                msg = getattr(choices[0], "message", None)
                # Leave tool-call replies untouched; agent clients parse them.
                if msg is not None and getattr(msg, "tool_calls", None):
                    return response
                if msg is not None and isinstance(getattr(msg, "content", None), str):
                    msg.content = msg.content + _label(getattr(response, "model", ""))
            except Exception:
                pass
            return response

        async def async_post_call_streaming_iterator_hook(
            self, user_api_key_dict, response: Any, request_data: dict
        ) -> AsyncGenerator[ModelResponseStream, None]:
            if not _wants_label(request_data):
                async for item in response:
                    yield item
                return
            model, last_id, injected, tools = "", "", False, False
            async for item in response:
                try:
                    model = getattr(item, "model", None) or model
                    last_id = getattr(item, "id", None) or last_id
                    ch = getattr(item, "choices", None)
                    if ch and getattr(getattr(ch[0], "delta", None), "tool_calls", None):
                        tools = True
                    if not injected and not tools and ch and getattr(ch[0], "finish_reason", None):
                        yield ModelResponseStream(
                            id=last_id, model=model,
                            choices=[StreamingChoices(index=0, delta=Delta(content=_label(model)), finish_reason=None)],
                        )
                        injected = True
                except Exception:
                    pass
                yield item
            if not injected and not tools and model:
                yield ModelResponseStream(
                    id=last_id, model=model,
                    choices=[StreamingChoices(index=0, delta=Delta(content=_label(model)), finish_reason=None)],
                )

    proxy_handler_instance = ModelLabel()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: ai
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
      annotations:
        checksum/config: "v7-pin-1.96.2"
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: litellm
          # Pinned to the digest of LiteLLM 1.96.2. The floating main-stable tag
          # pulled 1.105.1 on a restart (2026-10-14), and 1.105.1 shifts the
          # complexity_router tiers by one ("hi" went to Claude Sonnet).
          # Test the router (tier probe) before moving this pin.
          image: ghcr.io/berriai/litellm:main-stable@sha256:154e23bb5f31b1f10e16392a8ef299bd2cde08de3a64a6849002cfcc25ce3c63
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
          ports:
            - containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-secrets
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
          readinessProbe:
            httpGet: {path: /health/liveliness, port: 4000}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 150m, memory: 512Mi}
            limits: {memory: 3Gi}
      volumes:
        - name: config
          configMap:
            name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: ai
spec:
  type: NodePort
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
      nodePort: 32500
