apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gpu-workstation-exporter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:mattarvon/turing-cluster-gitops.git
    targetRevision: main
    path: manifests/gpu-workstation-exporter
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
  # NOTE: depends on nvidia_gpu_exporter running on the workstation at :9835.
  # If that machine is off, the target simply goes stale - nothing here breaks.
