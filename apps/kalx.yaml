apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kalx
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:mattarvon/turing-cluster-gitops.git
    targetRevision: main
    path: manifests/kalx
  destination:
    server: https://kubernetes.default.svc
    namespace: vms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true   # this is what makes `kubectl delete vm kalx` a reset
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  # Needs the out-of-band Secret vms/kalx-rdp (key `password`). See bootstrap/README.md.
  # KubeVirt's webhook stamps firmware serial/uuid and a PCI topology annotation; ignore them.
  ignoreDifferences:
    - group: kubevirt.io
      kind: VirtualMachine
      jsonPointers:
        - /spec/template/spec/domain/firmware
        - /spec/template/metadata/annotations/kubevirt.io~1pci-topology-version
