apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvme-storage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:mattarvon/turing-cluster-gitops.git
    targetRevision: main
    path: manifests/nvme-storage
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false          # never auto-delete a PV holding data
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
