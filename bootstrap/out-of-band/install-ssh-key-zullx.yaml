# One-shot: install the cluster admin SSH key on zullx.
#
# WHY THIS EXISTS
# Kept for rebuilding zullx, whose login user is `matt` rather than `ubuntu`.
#
# It did NOT fix the original problem, and the real cause is worth recording.
# SSH to zullx appeared dead from everywhere. Running this revealed the key was
# already installed: the blocker was a **stale host key on the client**. zullx
# had been rebuilt at some point, so its SSH host key changed, and the old entry
# in ~/.ssh/known_hosts made every connection fail closed.
#
#   ssh-keygen -R 192.168.1.216      # then reconnect and accept the new key
#
# Two lessons. "Permission denied" and "host key verification failed" are
# different failures and only one is about credentials - read the actual error.
# And a node that has been reimaged will do this to you every time.
#
# APPENDS - it does not overwrite, and checks before adding, so it is safe to
# re-run on a rebuilt node.
apiVersion: v1
kind: Pod
metadata:
  name: install-ssh-key-zullx
  namespace: default
spec:
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: zullx
  hostPID: true
  hostNetwork: true
  containers:
    - name: installer
      image: alpine:3.20
      securityContext:
        privileged: true
      env:
        - name: PUBKEY
          value: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKGSfDU36vyCQQXQQYrfpQ+nFb9jf6wibUuSzwhq5ajY claude-turing-cluster"
      command:
        - nsenter
        - "--target"
        - "1"
        - "--mount"
        - "--uts"
        - "--ipc"
        - "--net"
        - "--pid"
        - "--"
        - sh
        - -c
        - |
          set -e
          U=matt
          H=/home/$U
          K="$H/.ssh/authorized_keys"
          echo "host: $(hostname)  user: $U"
          echo "before: $([ -f "$K" ] && wc -l < "$K" || echo 0) key(s)"
          install -d -m 700 -o "$U" -g "$U" "$H/.ssh"
          touch "$K"
          if grep -qF "AAAAC3NzaC1lZDI1NTE5AAAAIKGSfDU36vyCQQXQQYrfpQ+nFb9jf6wibUuSzwhq5ajY" "$K"; then
              echo "key already present - nothing to do"
          else
              printf '%s\n' "$PUBKEY" >> "$K"
              echo "key appended"
          fi
          chmod 600 "$K"
          chown "$U:$U" "$K"
          echo "after : $(wc -l < "$K") key(s)"
          ls -l "$K"
