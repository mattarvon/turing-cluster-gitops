# Storage benchmark: Longhorn (replicated block storage, 2 replicas).
#
# Replicas live on zullx (/data/longhorn, NVMe) and nuc-flasher. Writes are
# synchronous to both, so one of them crosses the network - expect write
# throughput bounded by the link, and reads served locally where possible.
#
# Compare against fio-nfs.yaml: the question is whether replicated storage is
# fast enough to replace NFS for RWX workloads, not just safer.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fio-longhorn
  namespace: default
spec:
  accessModes: [ReadWriteMany]
  storageClassName: longhorn
  resources:
    requests:
      storage: 16Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fio-longhorn
  namespace: default
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      # Both storage tests pin to the same node so the comparison is like-for-like,
      # and deliberately NOT the NFS server, so NFS traffic crosses the network.
      nodeSelector:
        kubernetes.io/hostname: rk1-w1
      containers:
        - name: fio
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              apk add --no-cache fio >/dev/null
              cd /data
              echo "=================================================="
              echo "storage class : longhorn (replicated, 2 replicas)"
              echo "node          : $NODE_NAME"
              echo "=================================================="
              for job in \
                "seqread:read:1M:1" \
                "seqwrite:write:1M:1" \
                "randread4k:randread:4k:8" \
                "randwrite4k:randwrite:4k:8"
              do
                name=$(echo "$job" | cut -d: -f1)
                rw=$(echo "$job"   | cut -d: -f2)
                bs=$(echo "$job"   | cut -d: -f3)
                jobs=$(echo "$job" | cut -d: -f4)
                echo
                echo "--- $name ($rw, bs=$bs, jobs=$jobs) ---"
                fio --name="$name" --rw="$rw" --bs="$bs" --numjobs="$jobs" \
                    --size=512M --runtime=30 --time_based --direct=1 \
                    --ioengine=libaio --iodepth=16 --group_reporting \
                    --output-format=normal 2>/dev/null \
                  | grep -E "read:|write:|clat percentiles|99.00th|IOPS=" \
                  | head -6
              done
              rm -f /data/*.0 2>/dev/null || true
              echo
              echo "done"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: fio-longhorn
